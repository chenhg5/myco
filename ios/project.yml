# The Xcode project is generated from this file with XcodeGen and committed:
#   cd ios && xcodegen generate
# The app target is only the entry point; everything else is in MycoKit.
name: Myco
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MycoKit:
    path: MycoKit
targets:
  Myco:
    type: application
    platform: iOS
    sources:
      - Myco
    info:
      path: Myco/Info.plist
      properties:
        CFBundleDisplayName: myco
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # A workspace on the same Wi-Fi is plain HTTP at an address on the
        # local network (myco hub up --tunnel none). Everything else is HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # A workspace on a computer at home, or a proxy set in Settings on one.
        NSLocalNetworkUsageDescription: "连接局域网里的 myco 工作区，或你在设置里填的局域网代理。 myco connects to workspaces on your local network, and to a proxy there that you set in Settings."
        # Now and then the system lets the app look for new messages while
        # it is not in front, to announce them (MycoApp.refreshTask).
        BGTaskSchedulerPermittedIdentifiers: [dev.myco.ios.refresh]
        UIBackgroundModes: [fetch]
        # Asked the first time the camera is opened from the input, and the
        # first time a picture is saved from a preview.
        NSCameraUsageDescription: "拍照片发给你的 agent。 Take photos to send to your agents."
        # Asked the first time the input's microphone is tapped.
        NSMicrophoneUsageDescription: "只在你点了麦克风或在语音聊天时听：把你说的话变成消息，或者和 agent 通话。 myco listens only after you tap the microphone or during a voice chat you started: to turn what you say into a message, or to talk with an agent."
        NSSpeechRecognitionUsageDescription: "把你说的话转成文字（语音输入和语音聊天），用你在 App 里选的语言。 myco turns what you say into text, for dictation and voice chats, in the language you chose for the app."
        NSPhotoLibraryAddUsageDescription: "把对话里的图片存到相册。 Save pictures from conversations to your library."
        CFBundleURLTypes:
          - CFBundleURLName: dev.myco.ios
            CFBundleURLSchemes: [myco]
        # Export compliance, asked of every build sent to App Store Connect:
        # the app encrypts nothing itself. It talks HTTPS and keeps keys in
        # the keychain, both the system's, which is exempt. Change this the
        # day the app does its own encryption (end-to-end messages).
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: MycoKit
        product: MycoFeatures
      - package: MycoKit
        product: MycoCore
      - package: MycoKit
        product: MycoFake
      - package: MycoKit
        product: MycoStore
      - package: MycoKit
        product: MycoAPI
    settings:
      base:
        # A placeholder until the real bundle id is chosen.
        PRODUCT_BUNDLE_IDENTIFIER: dev.myco.ios
        PRODUCT_NAME: Myco
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  # Walks the app in a simulator, on the demo workspace.
  MycoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MycoAppUITests
    dependencies:
      - target: Myco
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.myco.ios.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Myco
schemes:
  Myco:
    build:
      targets:
        Myco: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MycoAppUITests
