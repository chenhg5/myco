# The Xcode project is generated from this file with XcodeGen and committed:
#   cd ios && xcodegen generate
# The app target is only the entry point; everything else is in MycoKit.
name: Myco
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MycoKit:
    path: MycoKit
targets:
  Myco:
    type: application
    platform: iOS
    sources:
      - Myco
    info:
      path: Myco/Info.plist
      properties:
        CFBundleDisplayName: myco
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # A workspace on the same Wi-Fi is plain HTTP at an address on the
        # local network (myco hub up --tunnel none). Everything else is HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.myco.ios
            CFBundleURLSchemes: [myco]
    dependencies:
      - package: MycoKit
        product: MycoFeatures
      - package: MycoKit
        product: MycoCore
      - package: MycoKit
        product: MycoFake
      - package: MycoKit
        product: MycoStore
      - package: MycoKit
        product: MycoAPI
    settings:
      base:
        # A placeholder until the real bundle id is chosen.
        PRODUCT_BUNDLE_IDENTIFIER: dev.myco.ios
        PRODUCT_NAME: Myco
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  # Walks the app in a simulator, on the demo workspace.
  MycoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MycoAppUITests
    dependencies:
      - target: Myco
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.myco.ios.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Myco
schemes:
  Myco:
    build:
      targets:
        Myco: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MycoAppUITests
