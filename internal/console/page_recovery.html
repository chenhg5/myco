<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recover local files</title>
<style>
:root { color-scheme:light dark; font:14px system-ui; }
body { margin:0; padding:12px 16px; }
[hidden] { display:none !important; }
li button { margin-inline-start:6px; }
label { display:block; }
select,button { font:inherit; margin:8px 0; padding:6px; }
ol { padding-inline-start:24px; }
li { margin:8px 0; overflow-wrap:anywhere; }
</style>
<script defer src="./recover.js"></script>
</head>
<body>
<p id="intro"></p>
<label><span id="label"></span><select id="source"></select></label>
<p role="status" id="status"></p>
<ol id="files"></ol>
<button id="more" hidden></button>
</body>
</html>
