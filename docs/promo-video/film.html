<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The myco promo film (v6, 60 s): only the app's own interface. Every frame is a
     pure function of time: window.seek(t) sets the whole picture for second t, and
     render.mjs steps through it. Inputs come from the page's init script:
     window.LANG ("en" | "zh") and window.ASSETS (folder of capture.cjs's captures). -->
<link rel="stylesheet" href="node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/400.css">
<style>
:root {
  --bg: #0b0c0d; --green: #52a685; --ink: #f2f4f3; --muted: #8b928f;
  --sans: Inter, "Noto Sans SC", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); font-family: var(--sans); color: var(--ink); }
.abs { position: absolute; }
#glow { position: absolute; width: 1700px; height: 1700px; border-radius: 50%; left: 110px; top: -320px;
  background: radial-gradient(closest-side, rgba(82,166,133,.12), rgba(82,166,133,.03) 55%, transparent 72%); }
#grain { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px); background-size: 4px 4px; }

/* the app window */
#frame { position: absolute; left: 160px; top: 40px; width: 1600px; height: 1000px; border-radius: 16px; overflow: hidden;
  box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08); background: #141517; transform-origin: 50% 50%; }
#cam { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; }
#cam img.shot { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; }
.hl { position: absolute; border-radius: 10px; box-shadow: 0 0 0 2px rgba(82,166,133,.95), 0 0 0 9999px rgba(0,0,0,.42); pointer-events: none; }

/* terminals (the opening) */
.term { position: absolute; width: 760px; border-radius: 12px; background: #16181a; overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
.term .bar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #1d2023; color: #8b928f; font-size: 14px; font-family: var(--sans); }
.term .dot { width: 11px; height: 11px; border-radius: 50%; background: #3a3f42; }
.term .bar b { margin-left: 8px; font-weight: 600; color: #b7bdba; }
.term .body { padding: 18px 22px 22px; font-family: var(--mono); font-size: 22px; line-height: 1.7; color: #d7dcd9; white-space: pre; min-height: 190px; }
.term .p { color: var(--green); }
.term .dim { color: #7d8582; }
.term .caret { display: inline-block; width: 9px; height: 19px; background: #d7dcd9; vertical-align: -3px; }

/* the phone */
#phone { position: absolute; width: 430px; height: 900px; border-radius: 62px; background: #050505; padding: 14px;
  box-shadow: 0 40px 120px rgba(0,0,0,.7), 0 0 0 2px #2a2c2e; }
#phone .screen { width: 100%; height: 100%; border-radius: 48px; overflow: hidden; position: relative; background: #141517; }
#phone img { position: absolute; left: 0; top: 0; width: 100%; }
#phone .notch { position: absolute; left: 50%; top: 12px; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #050505; }

/* title and end */
.kinetic { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; letter-spacing: -0.02em; }
#cursor { position: absolute; width: 26px; height: 26px; pointer-events: none; z-index: 20; }
#ripple { position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); z-index: 19; }
</style>
</head>
<body>
<div id="glow"></div>
<div id="grain"></div>
<div id="frame"><div id="cam"></div></div>
<div id="terms"></div>
<div id="phone"><div class="screen"><img id="phoneimg"><div class="notch"></div></div></div>
<div id="title"></div>
<svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.6 14.8 L11.6 21.6 L14.6 20.3 L11.7 13.6 L18 13.6 Z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
<div id="ripple"></div>
<script>
const LANG = window.LANG || 'zh';
const zh = LANG === 'zh';
const T = (z, e) => (zh ? z : e);
const A = (window.ASSETS || ('../assets/app-film/' + LANG)) + '/';
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const eio = (p) => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const out3 = (p) => 1 - Math.pow(1 - p, 3);
const in3 = (p) => p * p * p;
const expoOut = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));

// ---------- the app window and its camera ----------
const FW = 1600, FH = 1000, K0 = FW / 1280; // display px per app px
const cam = $('cam');
const IMG = {};
function img(name) {
  if (!IMG[name]) { const i = new Image(); i.className = 'shot'; i.src = A + name + '.png'; IMG[name] = i; }
  return IMG[name];
}
let shown = '';
function show(name) {
  if (shown === name) { while (cam.children.length > 1) cam.lastChild.remove(); return; }
  shown = name; cam.innerHTML = ''; cam.appendChild(img(name).cloneNode());
}
let CAM = { k: K0, x: 0, y: 0 };
function camera(fx, fy, s) {
  const k = K0 * s;
  let x = FW / 2 - fx * k, y = FH / 2 - fy * k;
  x = clamp(x, FW - 1280 * k, 0); y = clamp(y, FH - 800 * k, 0);
  cam.style.transform = `translate(${x}px, ${y}px) scale(${k})`;
  CAM = { k, x, y };
}
function keys(t, ks) { // [[t, fx, fy, s], ...] eased between
  if (t <= ks[0][0]) return ks[0].slice(1);
  for (let i = 0; i < ks.length - 1; i++) {
    const [t0, ...a] = ks[i], [t1, ...b] = ks[i + 1];
    if (t <= t1) { const p = eio(seg(t, t0, t1)); return a.map((v, j) => lerp(v, b[j], p)); }
  }
  return ks[ks.length - 1].slice(1);
}
function hl(b, op, pad = 6) { // a box (app px) lit, the rest dimmed
  if (!b || op <= 0) return;
  const d = document.createElement('div'); d.className = 'hl';
  Object.assign(d.style, { left: b[0] - pad + 'px', top: b[1] - pad + 'px', width: b[2] + 2 * pad + 'px', height: b[3] + 2 * pad + 'px', opacity: op });
  cam.appendChild(d);
}
// app px -> screen px (frame at rest)
const FX = 160, FY = 40;
const toScreen = (ax, ay) => ({ x: FX + CAM.x + ax * CAM.k, y: FY + CAM.y + ay * CAM.k });
function cursorTo(t, pts) { // [[t, ax, ay], ...] in app px; null when before/after
  const c = $('cursor');
  if (t < pts[0][0] - .25 || t > pts[pts.length - 1][0] + .5) { c.style.display = 'none'; return; }
  const [ax, ay] = keys(t, pts.map(([tt, x, y]) => [tt, x, y]));
  const s = toScreen(ax, ay);
  c.style.display = ''; c.style.left = s.x + 'px'; c.style.top = s.y + 'px';
  c.style.opacity = Math.min(seg(t, pts[0][0] - .25, pts[0][0]), 1 - seg(t, pts[pts.length - 1][0] + .2, pts[pts.length - 1][0] + .5));
}
function rippleAt(t, at, ax, ay) {
  const r = $('ripple'); const p = seg(t, at, at + .45);
  if (p <= 0 || p >= 1) return;
  const s = toScreen(ax, ay);
  r.style.display = ''; r.style.left = s.x - 30 + 'px'; r.style.top = s.y - 30 + 'px';
  r.style.transform = `scale(${.4 + p * 1.4})`; r.style.opacity = 1 - p;
}
// the frame's own motion: in, out, a swap between two shots
function frameAt(op, sc = 1, dx = 0, blur = 0) {
  const f = $('frame');
  f.style.display = op > 0 ? '' : 'none';
  f.style.opacity = op; f.style.transform = `translateX(${dx}px) scale(${sc})`;
  f.style.filter = blur > .1 ? `blur(${blur}px)` : 'none';
}
function swap(t, at) { // a quick blur-slide at a cut
  const a = seg(t, at - .18, at), b = seg(t, at, at + .22);
  if (a > 0 && a < 1) return { dx: -in3(a) * 160, blur: a * 14 };
  if (b > 0 && b < 1) return { dx: (1 - out3(b)) * 160, blur: (1 - b) * 14 };
  return { dx: 0, blur: 0 };
}

// ---------- title and end ----------
const SYMBOL = '../assets/logo/myco-symbol.svg';
const WORD = '../assets/logo/myco-wordmark-dark.svg';
function titleCard(t) {
  const el = $('title');
  if (t >= 4.2 && t < 52) { el.innerHTML = ''; return; }
  if (t < 4.2) {
    // the pixel mushroom grows in steps, then the word
    const g = seg(t, .3, 1.6); const step = Math.ceil(g * 8) / 8;
    const w = seg(t, 1.5, 2.3); const outp = seg(t, 3.5, 4.2);
    el.innerHTML = `
      <img src="${SYMBOL}" class="abs" style="left:${960 - 110}px;top:${360 - 20 * w}px;width:220px;filter:invert(1);transform:scale(${step * (1 - .15 * outp)});transform-origin:50% 100%;opacity:${1 - outp}">
      <img src="${WORD}" class="abs" style="left:${960 - 170}px;top:${640}px;width:340px;opacity:${out3(w) * (1 - outp)};transform:translateY(${(1 - out3(w)) * 24}px)">`;
    return;
  }
  // the end: the mark, the line, where to get it
  const u = seg(t, 52.0, 53.0), l = seg(t, 52.8, 53.8), d = seg(t, 54.0, 55.0), o = seg(t, 59.0, 60.0);
  el.innerHTML = `
    <img src="${SYMBOL}" class="abs" style="left:${960 - 80}px;top:${230}px;width:160px;filter:invert(1);opacity:${out3(u) * (1 - o)};transform:scale(${.85 + .15 * expoOut(u)});transform-origin:50% 100%">
    <img src="${WORD}" class="abs" style="left:${960 - 150}px;top:${440}px;width:300px;opacity:${out3(u) * (1 - o)}">
    <div class="kinetic" style="top:580px;font-size:${zh ? 64 : 60}px;opacity:${out3(l) * (1 - o)};transform:translateY(${(1 - out3(l)) * 20}px)">${T('你的 AI agent，一个 App 就够', 'All your AI agents, one app')}</div>
    <div class="kinetic" style="top:720px;font-size:28px;font-weight:400;color:#9aa19e;opacity:${out3(d) * (1 - o)}">${T('Mac · Windows · Linux　免费下载', 'Free for Mac, Windows and Linux')}</div>
    <div class="kinetic" style="top:776px;font-size:26px;font-weight:400;color:#7d8582;font-family:var(--mono);opacity:${out3(d) * (1 - o)}">github.com/myco-ai/myco</div>`;
}

// ---------- the opening: agents scattered in terminals ----------
const TERMS = [
  { at: 4.3, x: 90, y: 80, r: -3, title: 'claude', lines: [['p', '> '], ['', T('把定价页的 FAQ 写完', 'finish the FAQ on the pricing page')], ['br'], ['dim', '✻ ' + T('思考中…（12 秒）', 'Thinking… (12s)')], ['br'], ['dim', '⎿ ' + T('读了 3 个文件', 'Read 3 files')]] },
  { at: 5.3, x: 1060, y: 130, r: 2.5, title: 'codex', lines: [['p', '› '], ['', T('加一个 /api/plans 接口', 'add a /api/plans endpoint')], ['br'], ['dim', '• ' + T('正在跑测试…', 'Running tests…')], ['br'], ['dim', '  ✓ 18 passed']] },
  { at: 6.3, x: 220, y: 590, r: 2, title: 'gemini', lines: [['p', '> '], ['', T('总结一下这周的 issue', "summarize this week's issues")], ['br'], ['dim', '⠋ ' + T('读取中…', 'Reading…')], ['br'], ['dim', T('  共 23 个 issue', '  23 issues')]] },
  { at: 7.3, x: 980, y: 630, r: -2, title: 'ssh build-01', lines: [['p', '$ '], ['', 'go test ./...'], ['br'], ['dim', 'ok   myco/internal/runner  1.8s'], ['br'], ['dim', 'ok   myco/internal/app     2.4s']] },
];
// where each terminal lands in the app: the sidebar's conversations (app px)
const LAND = [[120, 293], [120, 325], [120, 357], [120, 687]];
function typed(lines, n) { // the first n characters of a terminal's lines
  let out = '', left = n;
  for (const [cls, text] of lines) {
    if (cls === 'br') { if (left > 0) out += '\n'; continue; }
    const s = text.slice(0, Math.max(0, left)); left -= text.length;
    out += cls ? `<span class="${cls}">${s}</span>` : s;
  }
  return out;
}
function terminals(t) {
  const box = $('terms');
  if (t < 4 || t >= 14) { box.innerHTML = ''; return; }
  let html = '';
  TERMS.forEach((w, i) => {
    const inP = out3(seg(t, w.at, w.at + .45));
    if (inP <= 0) return;
    const total = w.lines.reduce((n, [c, s]) => n + (c === 'br' ? 0 : s.length), 0);
    const chars = Math.floor(seg(t, w.at + .4, w.at + 2.2) * total);
    const drift = Math.sin((t + i) * .6) * 6;
    // into the app: each flies to its row in the sidebar and shrinks away
    const fly = eio(seg(t, 12.2 + i * .12, 13.4 + i * .12));
    const land = LAND[i];
    const tx = lerp(w.x, FX + land[0] * K0 - 380, fly), ty = lerp(w.y + drift, FY + land[1] * K0 - 115, fly);
    const sc = lerp(1, .06, fly), op = inP * (1 - seg(fly, .8, 1));
    html += `<div class="term" style="left:${tx}px;top:${ty}px;opacity:${op};transform:rotate(${w.r * (1 - fly)}deg) scale(${sc * (.94 + .06 * inP)})">
      <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><b>${w.title}</b></div>
      <div class="body">${typed(w.lines, chars)}${chars < total || Math.floor(t * 2) % 2 ? '<span class="caret"></span>' : ''}</div></div>`;
  });
  box.innerHTML = html;
}

// ---------- the app ----------
function boxes() { return window.BOXES || {}; }
function appScenes(t) {
  const B = boxes();
  $('ripple').style.display = 'none';
  if (t < 12.6 || t >= 52) { frameAt(0); return; }
  // 12.6-18: the app arrives, the agents land in its sidebar
  if (t < 18) {
    show('home');
    const p = expoOut(seg(t, 12.6, 13.6));
    const [fx, fy, s] = keys(t, [[13.6, 640, 400, 1], [17.6, 560, 380, 1.08]]);
    camera(fx, fy, s);
    hl(B['home.chats'] && [11, 280, 229, 160], seg(t, 13.6, 14.0) * (1 - seg(t, 15.6, 16.2)) * .9);
    const sw = swap(t, 18);
    frameAt(p, lerp(.92, 1, p), sw.dx, sw.blur);
    return;
  }
  // 18-20.6: your own agents, signed in to your own subscriptions
  if (t < 20.6) {
    show('agents');
    const [fx, fy, s] = keys(t, [[18, 700, 330, 1.25], [20.6, 760, 300, 1.4]]);
    camera(fx, fy, s);
    hl(B['agents.list'] && [B['agents.list'][0], B['agents.list'][1], B['agents.list'][2], 130], seg(t, 18.6, 19.0) * .95);
    const sw = swap(t, 20.6); frameAt(1, 1, sw.dx, sw.blur);
    return;
  }
  // 20.6-23.6: a new conversation: the agent, start it
  if (t < 23.6) {
    show('new');
    const d = B['new.dialog'] || [359, 122, 562, 557];
    const [fx, fy, s] = keys(t, [[20.6, d[0] + d[2] / 2, d[1] + d[3] / 2, 1.3], [23.6, d[0] + d[2] / 2, d[1] + d[3] / 2 + 30, 1.38]]);
    camera(fx, fy, s);
    const go = [d[0] + d[2] - 48, d[1] + d[3] - 26];
    cursorTo(t, [[21.2, d[0] + 90, d[1] + 160], [21.9, d[0] + 90, d[1] + 160], [22.7, go[0], go[1]], [23.1, go[0], go[1]]]);
    rippleAt(t, 22.75, go[0], go[1]);
    const sw = swap(t, 23.6); frameAt(1, 1, sw.dx, sw.blur);
    return;
  }
  // 23.6-28: it works; its run folded into a line, its answer
  if (t < 28) {
    show('chat');
    const c = B['chat.detail'] || [628, 48, 376, 744];
    const [fx, fy, s] = keys(t, [[23.6, c[0] + c[2] / 2, 300, 1.55], [28, c[0] + c[2] / 2, 470, 1.6]]);
    camera(fx, fy, s);
    const sw = swap(t, 28); frameAt(1, 1, sw.dx, sw.blur);
    return;
  }
  // 28-31.8: several at once
  if (t < 31.8) {
    show('panes');
    const [fx, fy, s] = keys(t, [[28, 640, 400, 1.18], [31.8, 640, 400, 1.0]]);
    camera(fx, fy, s);
    const sw = swap(t, 31.8); frameAt(1, 1, sw.dx, sw.blur);
    return;
  }
  // 31.8-36: one hands work to another, and it comes back
  if (t < 36) {
    show('home');
    const d = B['home.dispatch'] || [332, 149, 604, 59];
    const [fx, fy, s] = keys(t, [[31.8, d[0] + d[2] / 2, d[1] + 120, 1.35], [36, d[0] + d[2] / 2, d[1] + 90, 1.5]]);
    camera(fx, fy, s);
    hl(d, seg(t, 32.3, 32.8) * .95, 8);
    const sw = swap(t, 36); frameAt(1, 1, sw.dx, sw.blur);
    return;
  }
  // 36-40: another computer: its terminal, a command running
  if (t < 40) {
    show('terminal');
    const [fx, fy, s] = keys(t, [[36, 816, 330, 1.45], [40, 816, 360, 1.55]]);
    camera(fx, fy, s);
    frameAt(1, 1, swap(t, 36).dx, swap(t, 36).blur);
    return;
  }
  // 40-44: and the phone: the app steps back, the phone comes in
  if (t < 44) {
    show('home');
    camera(640, 400, 1);
    const p = eio(seg(t, 40, 40.8));
    const sw = swap(t, 44);
    frameAt(1 - .35 * p, 1 - .1 * p, -220 * p + sw.dx, sw.blur);
    return;
  }
  // 44-52: on their own: automations (and, in Chinese, the apps)
  const apps = zh && t >= 48;
  show(apps ? 'apps' : 'automations');
  if (apps) {
    const [fx, fy, s] = keys(t, [[48, 640, 330, 1.25], [52, 660, 380, 1.32]]);
    camera(fx, fy, s);
  } else {
    const [fx, fy, s] = keys(t, [[44, 760, 330, 1.2], [48, 760, 520, 1.35], [52, 760, 560, 1.38]]);
    camera(fx, fy, s);
  }
  const sw = zh ? swap(t, 48) : { dx: 0, blur: 0 };
  const o = seg(t, 51.6, 52);
  frameAt(1 - o, 1 - .04 * o, sw.dx + swap(t, 44).dx, sw.blur + swap(t, 44).blur + o * 10);
}
function phone(t) {
  const ph = $('phone');
  if (t < 40 || t >= 44.2) { ph.style.display = 'none'; return; }
  ph.style.display = '';
  const p = expoOut(seg(t, 40.3, 41.2)), o = seg(t, 43.8, 44.2);
  ph.style.left = lerp(1920, 1180, p) + 'px'; ph.style.top = '90px';
  ph.style.opacity = 1 - o; ph.style.transform = `rotate(${lerp(6, 0, p)}deg)`;
  // the conversation scrolls a little, as if read on the phone
  $('phoneimg').style.transform = `translateY(${-lerp(0, 120, eio(seg(t, 41.5, 43.6)))}px)`;
}

// sound-effect cues the mixer reads (seconds, name, gain)
window.CUES = [
  [0.4, 'pop', .6], [1.5, 'shimmer', .5],
  ...TERMS.map((w) => [w.at, 'pop', .7]),
  ...TERMS.flatMap((w) => Array.from({ length: 6 }, (_, i) => [w.at + .45 + i * .18, 'tick', .25])),
  [12.2, 'whoosh', .8], [13.5, 'zip', .6], [17.85, 'whoosh', .45],
  [20.45, 'whoosh', .4], [22.75, 'click', .9], [23.45, 'whoosh', .4], [27.85, 'whoosh', .4], [28.2, 'pop', .5],
  [31.65, 'whoosh', .4], [32.4, 'ding', .6], [35.85, 'whoosh', .4], [40.3, 'whoosh', .6], [43.85, 'whoosh', .45],
  ...(zh ? [[47.85, 'whoosh', .4]] : []), [52.0, 'shimmer', .6],
];

window.seek = (t) => {
  $('glow').style.opacity = .6 + .4 * Math.sin(t * .4);
  titleCard(t); terminals(t); appScenes(t); phone(t);
  if (!((t >= 21 && t < 23.6))) $('cursor').style.display = 'none';
};
window.ready = (async () => {
  // (file:// pages read files with XHR, not fetch)
  try { const x = new XMLHttpRequest(); x.open('GET', A + 'boxes.json', false); x.send(); window.BOXES = JSON.parse(x.responseText); } catch { window.BOXES = {}; }
  $('phoneimg').src = A + 'phone.png';
  const names = ['home', 'agents', 'new', 'chat', 'panes', 'terminal', 'automations', ...(zh ? ['apps'] : [])];
  await Promise.all([...names.map((n) => img(n).decode().catch(() => console.error('missing ' + n))), $('phoneimg').decode().catch(() => console.error('missing phone'))]);
  for (const s of [SYMBOL, WORD]) { const i = new Image(); i.src = s; await i.decode().catch(() => console.error('missing ' + s)); }
  await document.fonts.ready;
})();
</script>
</body>
</html>
