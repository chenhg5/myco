name: android

on:
  push:
    paths: ['android/**', 'internal/api/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'internal/api/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build, lint and unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:lintDebug :core:conversation:test :core:network:test
      - name: Build isolated test Hub
        run: go build -o "$RUNNER_TEMP/myco-android-test" ./cmd/myco
      - name: Real Hub contract
        working-directory: android
        run: python3 tools/hub-fixture.py --binary "$RUNNER_TEMP/myco-android-test" -- ./gradlew :core:network:test
      - name: Native UI and WebView journeys
        working-directory: android
        timeout-minutes: 12
        run: |
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd --name myco-ci --package 'system-images;android-35;google_apis;x86_64' --device pixel_7 --path "$RUNNER_TEMP/myco-ci.avd"
          sed -i 's/^hw.lcd.width=.*/hw.lcd.width=432/; s/^hw.lcd.height=.*/hw.lcd.height=960/; s/^hw.lcd.density=.*/hw.lcd.density=180/' "$RUNNER_TEMP/myco-ci.avd/config.ini"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd myco-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -feature -Vulkan -memory 2048 -cores 2 > "$RUNNER_TEMP/myco-emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: myco-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/**/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
            android/app/build/reports/androidTests/
            ${{ runner.temp }}/myco-emulator.log
          retention-days: 14
