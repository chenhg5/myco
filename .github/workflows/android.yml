name: android

on:
  push:
    paths: ['android/**', 'internal/api/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'internal/api/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Android SDK
        run: android/tools/setup-sdk-linux.sh "$RUNNER_TEMP/android-sdk"
      - name: Build, lint and unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:lintDebug :core:conversation:test :core:network:test
      - name: Build isolated test Hub
        run: python3 scripts/prepare-apps.py && go build -o "$RUNNER_TEMP/myco-android-test" ./cmd/myco
      - name: Real Hub contract
        working-directory: android
        run: python3 tools/hub-fixture.py --binary "$RUNNER_TEMP/myco-android-test" -- ./gradlew :core:network:test
      - name: Native UI and WebView journeys
        working-directory: android
        timeout-minutes: 12
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/myco-avd
        run: |
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name myco-ci --package 'system-images;android-35;google_apis;x86_64' --device pixel_7 --path "$ANDROID_AVD_HOME/myco-ci.avd"
          printf 'avd.ini.encoding=UTF-8\npath=%s/myco-ci.avd\ntarget=android-35\n' "$ANDROID_AVD_HOME" > "$ANDROID_AVD_HOME/myco-ci.ini"
          sed -i 's/^hw.lcd.width=.*/hw.lcd.width=432/; s/^hw.lcd.height=.*/hw.lcd.height=960/; s/^hw.lcd.density=.*/hw.lcd.density=180/' "$ANDROID_AVD_HOME/myco-ci.avd/config.ini"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd myco-ci -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -feature -Vulkan -memory 2048 -cores 2 > "$RUNNER_TEMP/myco-emulator.log" 2>&1 &
          emulator_pid=$!
          adb start-server
          for attempt in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "$RUNNER_TEMP/myco-emulator.log"; exit 1; fi
            booted="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$booted" = 1 ]; then break; fi
            sleep 2
          done
          test "${booted:-}" = 1
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myco-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/**/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
            android/app/build/reports/androidTests/
            ${{ runner.temp }}/myco-emulator.log
          retention-days: 14
