name: ci

# Runs on every push and pull request. (release.yml publishes when VERSION changes on main.)
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt and vet
        run: make vet
      - name: Unit and integration tests (race detector)
        run: make test
      - name: Smoke test (real binary, separate processes)
        run: make smoke

  windows:
    # Native Windows: build and the tests that do not need a POSIX shell
    # (tests driving fake CLIs written as sh scripts skip themselves here).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: build
        run: go build -o bin/myco.exe ./cmd/myco
      - name: tests
        run: go test ./...
      - name: the binary runs
        shell: pwsh
        run: |
          bin/myco.exe --version
          $env:MYCO_NO_UPDATE_CHECK = "1"
          bin/myco.exe version --offline
      - name: the console app builds and runs
        shell: pwsh
        run: |
          go build -tags production -o bin/myco-app.exe ./cmd/myco-app
          bin/myco-app.exe --version

  app-macos:
    # The console app: built natively (cgo + the system WebKit) and kept as a
    # downloadable artifact (ad-hoc signed; the release workflow signs and
    # notarizes once the Apple secrets are configured).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet and test the app
        run: go vet ./cmd/myco-app/ ./internal/console/ && go test ./cmd/myco-app/ ./internal/console/
      - name: build myco.app
        run: make app
      - name: the app binary runs
        run: bin/myco.app/Contents/MacOS/myco-app --version
      - name: zip
        run: ditto -c -k --keepParent bin/myco.app bin/myco-app-macos-arm64.zip
      - name: the Intel build (as the release builds it)
        run: GOARCH=amd64 make app && lipo -archs bin/myco.app/Contents/MacOS/myco-app | grep -qx x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: myco-app-macos-arm64
          path: bin/myco-app-macos-arm64.zip
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the dashboard
        run: make web
      - name: Committed internal/web/dist matches the source
        run: |
          if ! git diff --quiet -- internal/web/dist || [ -n "$(git ls-files --others --exclude-standard internal/web/dist)" ]; then
            git status --short internal/web/dist
            echo "::error::internal/web/dist is stale: run 'make web' and commit the result"
            exit 1
          fi
