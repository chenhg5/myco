name: ci

# Runs on every push and pull request. (release.yml publishes when VERSION changes on main.)
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch replaces the run of the older one: its
# result would be stale, and the runners it holds delay the new run and
# releases.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What changed, so the slow UI smoke runs only when the UI did.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.c.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        run: |
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = pull_request ]; then base="${{ github.event.pull_request.base.sha }}"; fi
          # Unknown base (a new branch, a force push): run everything.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo ui=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # The UI smoke drives the built web app against its mock backend
          # (web/mock): only web/ and this workflow can change its result.
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^(web/|\.github/workflows/ci\.yml$)'; then
            echo ui=true >> "$GITHUB_OUTPUT"
          else
            echo ui=false >> "$GITHUB_OUTPUT"
          fi
          git diff --name-only "$base" "${{ github.sha }}" | head -50

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Release source regression checks
        run: python3 scripts/release-source.test.py
      - name: gofmt and vet
        run: make vet
      - name: Unit and integration tests (race detector)
        run: make test
      - name: Smoke test (real binary, separate processes)
        run: make smoke

  windows:
    # Native Windows: build and the tests that do not need a POSIX shell
    # (tests driving fake CLIs written as sh scripts skip themselves here).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check app preparation
        run: python scripts/prepare-apps.test.py
      - name: vet
        run: go vet ./...
      - name: Prepare pinned builtin apps
        run: python scripts/prepare-apps.py
      - name: build
        run: go build -o bin/myco.exe ./cmd/myco
      - name: tests
        run: go test ./...
      - name: the binary runs
        shell: pwsh
        run: |
          bin/myco.exe --version
          $env:MYCO_NO_UPDATE_CHECK = "1"
          bin/myco.exe version --offline
      - name: the console app builds and runs
        shell: pwsh
        run: |
          go build -tags production -o bin/myco-app.exe ./cmd/myco-app
          bin/myco-app.exe --version

  app-macos:
    # The console app: built natively (cgo + the system WebKit) and kept as a
    # downloadable artifact (ad-hoc signed; the release workflow signs and
    # notarizes once the Apple secrets are configured).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet and test the app
        run: go vet ./cmd/myco-app/ ./internal/console/ && go test ./cmd/myco-app/ ./internal/console/
      - name: build myco.app
        run: make app
      - name: the app binary runs
        run: bin/myco.app/Contents/MacOS/myco-app --version
      - name: zip
        run: ditto -c -k --keepParent bin/myco.app bin/myco-app-macos-arm64.zip
      - name: the Intel build (as the release builds it)
        run: GOARCH=amd64 make app && lipo -archs bin/myco.app/Contents/MacOS/myco-app | grep -qx x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: myco-app-macos-arm64
          path: bin/myco-app-macos-arm64.zip
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the dashboard
        run: make web
      - name: Runner restart display states
        run: node web/scripts/runner-state.test.mjs
      - name: Committed internal/web/dist matches the source
        run: |
          if ! git diff --quiet -- internal/web/dist || [ -n "$(git ls-files --others --exclude-standard internal/web/dist)" ]; then
            git status --short internal/web/dist
            echo "::error::internal/web/dist is stale: run 'make web' and commit the result"
            exit 1
          fi

  ui:
    # The App UI smoke test (web/scripts/ui-smoke.mjs): every page and the
    # main dialogs against the mock backend, one window size and theme per
    # runner, so a release no longer has to run it on a laptop first.
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    # A hung download (apt, Playwright's Chromium) must not hold the run for
    # GitHub's 6 hours: a release waits for main's ci to finish.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        combo: [1200-light, 1200-dark, 760-light, 760-dark]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: apps
        run: |
          commit=$(node -p 'require("./apps.lock.json").commit')
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: myco-ai/apps
          ref: ${{ steps.apps.outputs.commit }}
          path: .cache/apps-source
          persist-credentials: false
      - name: Prepare pinned app UI fixtures
        run: python3 scripts/prepare-apps.py --apps-dir .cache/apps-source/dist/official
      - name: Dependencies, Playwright and Chromium (with CJK fonts)
        timeout-minutes: 6
        run: |
          cd web && npm ci
          npm install -g playwright@1
          # Now and then a runner's apt or download stalls: give each try two
          # minutes and try three times rather than wait out the step.
          for try in 1 2 3; do
            timeout 120 node "$(npm root -g)/playwright/cli.js" install --with-deps chromium &&
              timeout 120 sudo apt-get install -y -q fonts-noto-cjk >/dev/null && break
            echo "::warning::Playwright / font install try $try stalled or failed; trying again"
            [ "$try" = 3 ] && exit 1
          done
      - name: UI smoke (${{ matrix.combo }})
        run: cd web && NODE_PATH="$(npm root -g)" npm run test:ui -- --combo ${{ matrix.combo }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-smoke-${{ matrix.combo }}
          path: web/ui-smoke/
          retention-days: 7

  app-contract:
    # Host changes must keep working with the exact released app SDK and UI.
    # App-owned unit/browser suites remain in myco-ai/apps.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: apps
        run: |
          commit=$(node -p 'require("./apps.lock.json").commit')
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: myco-ai/apps
          ref: ${{ steps.apps.outputs.commit }}
          path: .cache/apps-source
          persist-credentials: false
      - name: Dependencies for native/Hub contract fixtures
        run: |
          npm --prefix .cache/apps-source/templates ci
          npm install -g playwright@1.57.0
          playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: Prepare exact released app bundles
        run: python3 scripts/prepare-apps.py --apps-dir .cache/apps-source/dist/official
      - name: Real Hub, native adapters and application contracts
        env:
          APPS_TEST_ROOT: ${{ github.workspace }}/.cache/apps-source
        run: go test -count=1 ./internal/integration ./internal/console ./internal/sshcap -run 'Test(AgentActionsSDK|PageExportApplications|WhiteboardSharedExport|PaletteAgentToPage|ShoppingComparisonAgentToPage|DatabaseNativeBridgeAndProductionUI|RealSSHOverviewTemplateParser)$'
