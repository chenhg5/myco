name: ci

# Runs on every push and pull request. (release.yml publishes when VERSION changes on main.)
on:
  push:
    # Release snapshots contain only VERSION/CHANGELOG atop a source already
    # checked by release-source.py; avoid duplicating every OS/UI job while
    # the publishing workflow needs those same runners.
    branches-ignore: ["release/v*"]
  pull_request:
  # Read-only qualification for a frozen source; never builds a release/tag.
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact source SHA (empty uses the workflow commit)"
        type: string
        default: ""
      force_full:
        description: "Run the complete UI matrix"
        type: boolean
        default: true
  workflow_call:
    inputs:
      source_sha:
        description: "Exact source commit to qualify"
        required: true
        type: string
      force_full:
        description: "Run UI checks regardless of the latest push diff"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch replaces the run of the older one: its
# result would be stale, and the runners it holds delay the new run and
# releases.
concurrency:
  group: ci-${{ inputs.source_sha || github.ref }}-${{ inputs.force_full && 'release-full' || 'push' }}
  # On main a running check finishes (a newer push waits, and only the newest
  # waiting one runs next): with many pushes an hour, cancelling left main
  # with no commit fully checked, and releases freeze the latest green one.
  # Other branches still cancel the older run.
  cancel-in-progress: ${{ !inputs.force_full && github.ref != 'refs/heads/main' }}

jobs:
  # What changed, so the slow UI smoke runs only when the UI did.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.c.outputs.ui }}
      shards: ${{ steps.c.outputs.shards }}
      parts: ${{ steps.c.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - id: c
        env:
          FORCE_FULL: ${{ inputs.force_full || false }}
        run: |
          # Older frozen releases have an unsharded smoke script. Run each
          # window once, rather than silently running it in full three times.
          if grep -q 'const SHARD =' web/scripts/ui-smoke.mjs; then
            echo 'shards=[1,2,3]' >> "$GITHUB_OUTPUT"
            echo parts=3 >> "$GITHUB_OUTPUT"
          else
            echo 'shards=[1]' >> "$GITHUB_OUTPUT"
            echo parts=1 >> "$GITHUB_OUTPUT"
          fi
          if [ "$FORCE_FULL" = true ]; then echo ui=true >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = pull_request ]; then base="${{ github.event.pull_request.base.sha }}"; fi
          # Unknown base (a new branch, a force push): run everything.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo ui=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # The UI smoke drives the built web app against its mock backend
          # (web/mock): only web/ and this workflow can change its result.
          if git diff --name-only "$base" "${{ github.sha }}" | grep -qE '^(web/|\.github/workflows/ci\.yml$)'; then
            echo ui=true >> "$GITHUB_OUTPUT"
          else
            echo ui=false >> "$GITHUB_OUTPUT"
          fi
          git diff --name-only "$base" "${{ github.sha }}" | head -50

  go-race:
    # Each shard independently lists the exact source. The go gate lists it
    # again and requires one successful race result for every package.
    runs-on: ubuntu-latest
    env:
      RACE_SOURCE: ${{ inputs.source_sha || github.sha }}
      RACE_TOOLS: ${{ github.workflow_sha }}
      RACE_RUN: ${{ github.run_id }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: go-race (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      # CI policy comes from this workflow's immutable definition, not from
      # an older frozen source which may predate the sharding helper.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          sparse-checkout: |
            scripts/ci-race.py
            scripts/ci-race.test.py
            scripts/ci-race-weights.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Release source, build version and package coverage regressions
        if: matrix.shard == 1
        run: |
          python3 scripts/release-source.test.py
          python3 scripts/build-version.test.py
          python3 scripts/prepare-apps.test.py
          python3 .ci-tools/scripts/ci-race.test.py
      - name: gofmt and vet
        if: matrix.shard == 1
        run: make vet
      - name: Unit and integration tests (race detector, shard ${{ matrix.shard }}/3)
        run: |
          python3 .ci-tools/scripts/ci-race.py run --index ${{ matrix.shard }} --count 3 \
            --source "$RACE_SOURCE" --tools "$RACE_TOOLS" \
            --run-id "$RACE_RUN" --out "$RUNNER_TEMP/race-${{ matrix.shard }}"
      - name: Smoke test (real binary, separate processes)
        if: matrix.shard == 1
        run: make smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-race-${{ inputs.source_sha || github.sha }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/race-${{ matrix.shard }}/
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  go:
    # Preserve the release-required check name. A failed/cancelled/missing
    # shard cannot be hidden by a successful sibling or stale artifact.
    needs: go-race
    if: always()
    runs-on: ubuntu-latest
    env:
      RACE_SOURCE: ${{ inputs.source_sha || github.sha }}
      RACE_TOOLS: ${{ github.workflow_sha }}
      RACE_RUN: ${{ github.run_id }}
    steps:
      - name: Require every race shard and its checks
        env:
          RACE_RESULT: ${{ needs.go-race.result }}
        run: test "$RACE_RESULT" = success
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          sparse-checkout: |
            scripts/ci-race.py
            scripts/ci-race-weights.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          pattern: go-race-${{ inputs.source_sha || github.sha }}-*
          path: race-reports
      - name: Verify the independent complete package inventory and race results
        run: |
          python3 .ci-tools/scripts/ci-race.py verify --count 3 \
            --source "$RACE_SOURCE" --tools "$RACE_TOOLS" \
            --run-id "$RACE_RUN" --reports race-reports

  windows:
    # Native Windows: build and the tests that do not need a POSIX shell
    # (tests driving fake CLIs written as sh scripts skip themselves here).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check app preparation
        run: python scripts/prepare-apps.test.py
      - name: vet
        run: go vet ./...
      - name: Prepare pinned builtin apps
        run: python scripts/prepare-apps.py
      - name: build
        run: go build -o bin/myco.exe ./cmd/myco
      - name: tests
        run: go test ./...
      - name: the binary runs
        shell: pwsh
        run: |
          bin/myco.exe --version
          $env:MYCO_NO_UPDATE_CHECK = "1"
          bin/myco.exe version --offline
      - name: the console app builds and runs
        shell: pwsh
        run: |
          go build -tags production -o bin/myco-app.exe ./cmd/myco-app
          bin/myco-app.exe --version

  app-macos:
    # The console app: built natively (cgo + the system WebKit) and kept as a
    # downloadable artifact (ad-hoc signed; the release workflow signs and
    # notarizes once the Apple secrets are configured).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet and test the app
        run: go vet ./cmd/myco-app/ ./internal/console/ && go test ./cmd/myco-app/ ./internal/console/
      - name: build myco.app
        run: make app
      - name: the app binary runs
        run: bin/myco.app/Contents/MacOS/myco-app --version
      - name: zip
        run: ditto -c -k --keepParent bin/myco.app bin/myco-app-macos-arm64.zip
      - name: the Intel build (as the release builds it)
        run: GOARCH=amd64 make app && lipo -archs bin/myco.app/Contents/MacOS/myco-app | grep -qx x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: myco-app-macos-arm64
          path: bin/myco-app-macos-arm64.zip
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the dashboard
        run: make web
      - name: Local preference migration and recovery
        run: npm --prefix web run test:preferences
      - name: Runner restart display states
        run: node web/scripts/runner-state.test.mjs
      - name: Committed internal/web/dist matches the source
        run: |
          if ! git diff --quiet -- internal/web/dist || [ -n "$(git ls-files --others --exclude-standard internal/web/dist)" ]; then
            git status --short internal/web/dist
            echo "::error::internal/web/dist is stale: run 'make web' and commit the result"
            exit 1
          fi

  ui:
    # The App UI smoke test (web/scripts/ui-smoke.mjs): every page and the
    # main dialogs against the mock backend, per window size and theme, each
    # in three parts (--shard) running at once, so no job takes long.
    # The smoke runs in Playwright's own image (browsers, their system
    # libraries and CJK fonts already there): nothing is installed with apt,
    # which stalled and failed on runners. The rest is prepared on the runner.
    # PLAYWRIGHT is the image's version, and the Playwright it runs with:
    # the image's browsers match only its own Playwright.
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT: "1.57.0"
      PLAYWRIGHT_IMAGE: "mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd"
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        combo: [1200-light, 1200-dark, 760-light, 760-dark]
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    name: ui (${{ matrix.combo }} ${{ matrix.shard }}/${{ needs.changes.outputs.parts }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pull the Playwright image (meanwhile)
        run: (docker pull -q "$PLAYWRIGHT_IMAGE" > /tmp/pull.log 2>&1; echo $? > /tmp/pull.code) &
      - id: apps
        run: |
          commit=$(node -p 'require("./apps.lock.json").commit')
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: myco-ai/apps
          ref: ${{ steps.apps.outputs.commit }}
          path: .cache/apps-source
          persist-credentials: false
      - name: Prepare pinned app UI fixtures
        run: python3 scripts/prepare-apps.py --apps-dir .cache/apps-source/dist/official
      - name: Dependencies (npm; the browser comes with the image)
        timeout-minutes: 5
        run: |
          cd web && npm ci
          # Playwright itself, at the image's version, where the smoke finds it.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT"
          for i in $(seq 1 60); do [ -f /tmp/pull.code ] && break; sleep 2; done
          if [ "$(cat /tmp/pull.code 2>/dev/null)" != 0 ]; then cat /tmp/pull.log; docker pull "$PLAYWRIGHT_IMAGE"; fi
      - name: UI smoke (${{ matrix.combo }}, part ${{ matrix.shard }}/${{ needs.changes.outputs.parts }})
        # A step that fails is tried once more; passing then is listed as
        # flaky in this job's summary and does not fail the job.
        run: |
          summary_dir=$(dirname "$GITHUB_STEP_SUMMARY")
          docker run --rm --ipc=host --init -u "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/w" -v "$summary_dir:$summary_dir" -w /w/web \
            -e HOME=/tmp -e CI -e GITHUB_STEP_SUMMARY \
            "$PLAYWRIGHT_IMAGE" \
            sh -c 'fc-list :lang=zh | grep -q . || echo "::warning::no CJK font in the Playwright image"; node scripts/ui-smoke.mjs --combo ${{ matrix.combo }} --shard ${{ matrix.shard }}/${{ needs.changes.outputs.parts }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-results-${{ matrix.combo }}-${{ matrix.shard }}
          path: |
            web/ui-smoke/flakes.json
            web/ui-smoke/timings.json
            web/ui-smoke/*workflow-catalog-*.png
            web/ui-smoke/*member-account*.png
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-smoke-${{ matrix.combo }}-${{ matrix.shard }}
          path: web/ui-smoke/
          retention-days: 7

  app-contract:
    # Host changes must keep working with the exact released app SDK and UI.
    # App-owned unit/browser suites remain in myco-ai/apps.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT: "1.57.0"
      PLAYWRIGHT_IMAGE: "mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: apps
        run: |
          commit=$(node -p 'require("./apps.lock.json").commit')
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: myco-ai/apps
          ref: ${{ steps.apps.outputs.commit }}
          path: .cache/apps-source
          persist-credentials: false
      # Keep orchestration in the workflow commit, even for older frozen sources.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .contract-tools
          sparse-checkout: |
            scripts/ci-contracts.py
            scripts/ci-contracts.test.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Pull the pinned browser runtime
        run: docker pull -q "$PLAYWRIGHT_IMAGE"
      - name: Dependencies for native/Hub contract fixtures (npm only)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm --prefix .cache/apps-source/templates ci
          npm install --global --prefix "$RUNNER_TEMP/contract-node" --no-audit --no-fund "playwright@$PLAYWRIGHT"
          python3 .contract-tools/scripts/ci-contracts.test.py
      - name: Prepare exact released app bundles
        run: python3 scripts/prepare-apps.py --apps-dir .cache/apps-source/dist/official
      - name: Real Hub, native adapters and application contracts
        env:
          APPS_TEST_ROOT: ${{ github.workspace }}/.cache/apps-source
        run: |
          python3 .contract-tools/scripts/ci-contracts.py --image "$PLAYWRIGHT_IMAGE" \
            --playwright-prefix "$RUNNER_TEMP/contract-node" --out "$RUNNER_TEMP/app-contract-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-contract-results-${{ inputs.source_sha || github.sha }}
          path: ${{ runner.temp }}/app-contract-results/*.json*
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
