name: release

# Bump VERSION on main to publish a release (tag + binaries). Pushing a v* tag
# or running the workflow manually works too.
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.exists.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="$(tr -d '[:space:]' < VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.version }}" >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

  # The Mac app for both architectures, zipped (ad-hoc signed until the Apple
  # signing secrets are configured). The app updates itself from these.
  app:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build myco.app (arm64, amd64)
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            GOARCH=$arch make app VERSION=${{ needs.version.outputs.version }}
            lipo -archs bin/myco.app/Contents/MacOS/myco-app
            ditto -c -k --keepParent bin/myco.app dist/myco-app-darwin-$arch.zip
          done
      - name: the arm64 app runs
        run: unzip -q dist/myco-app-darwin-arm64.zip -d check && check/myco.app/Contents/MacOS/myco-app --version
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/*.zip

  cross:
    # The CLI for every platform and the Windows console app, at the same
    # time as the Mac app (tests already ran in ci on this commit): one
    # runner per OS, each building its two architectures.
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the CLI for ${{ matrix.goos }} (amd64, arm64)
        run: make cross GOOS_LIST=${{ matrix.goos }} VERSION=${{ needs.version.outputs.version }}
      - name: the Windows console app (no cgo needed)
        if: matrix.goos == 'windows'
        run: |
          for arch in amd64 arm64; do
            GOOS=windows GOARCH=$arch CGO_ENABLED=0 go build -tags production \
              -ldflags "-s -w -H windowsgui -X main.version=${{ needs.version.outputs.version }}" \
              -o bin/myco-app-windows-$arch.exe ./cmd/myco-app &
          done
          wait
          ls bin/myco-app-windows-amd64.exe bin/myco-app-windows-arm64.exe
      - name: Smoke-test the linux/amd64 release binary
        if: matrix.goos == 'linux'
        run: MYCO_BIN=$PWD/bin/myco-linux-amd64 scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cross-${{ matrix.goos }}
          path: bin/myco-*

  release:
    needs: [version, app, cross]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cross-*
          merge-multiple: true
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: bin
      - run: cd bin && sha256sum myco-* > SHA256SUMS && cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.version.outputs.version }}"
          scripts/changelog-section.sh "$v" > notes.md || true
          if [ -s notes.md ]; then
            gh release create "$v" bin/* --target "$GITHUB_SHA" --notes-file notes.md
          else
            gh release create "$v" bin/* --target "$GITHUB_SHA" --generate-notes
          fi
