name: release

# Bump VERSION on main to publish a release (tag + binaries). Pushing a v* tag
# or running the workflow manually works too.
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="$(tr -d '[:space:]' < VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.v.outputs.version }}" >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.exists.outputs.skip != 'true'
        run: go test ./...
      - if: steps.exists.outputs.skip != 'true'
        run: make cross VERSION=${{ steps.v.outputs.version }} && (cd bin && sha256sum myco-* > SHA256SUMS)
      - if: steps.exists.outputs.skip != 'true'
        name: Smoke-test the linux/amd64 release binary
        run: MYCO_BIN=$PWD/bin/myco-linux-amd64 scripts/smoke.sh
      - if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.v.outputs.version }}" bin/* --target "$GITHUB_SHA" --generate-notes
