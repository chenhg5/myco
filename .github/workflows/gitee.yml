name: gitee

# Mirror a published release to gitee.com/cg33/myco, as a run of its own.
# GitHub has already published when this starts, so a Gitee outage or a slow
# upload never fails the release run nor keeps it in progress.
#
# Gitee gives a repository 1 GB of release attachments: scripts/gitee-sync.sh
# keeps only the newest release's binaries and points older notes at GitHub.
# Re-run it by hand when a mirror failed:
#   Actions › gitee › Run workflow (with the version), or
#   GITEE_TOKEN=... scripts/gitee-sync.sh vX.Y.Z
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release to mirror (vX.Y.Z)"
        required: true

permissions:
  contents: read

jobs:
  mirror:
    # A sign-only (or skipped) release run publishes nothing to mirror.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Mirror to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN is not set: skipping the Gitee mirror."
            exit 0
          fi
          if [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          else
            # The newest GitHub release whose tag points at the commit this
            # release run published (VERSION-push and tag-push both).
            v=""
            for t in $(gh api "repos/$REPO/releases?per_page=10" --jq '.[].tag_name'); do
              if [ "$(gh api "repos/$REPO/commits/$t" --jq .sha)" = "$SHA" ]; then v="$t"; break; fi
            done
            if [ -z "$v" ]; then
              echo "This release run published no release: nothing to mirror."
              exit 0
            fi
          fi
          scripts/gitee-sync.sh "$v"
